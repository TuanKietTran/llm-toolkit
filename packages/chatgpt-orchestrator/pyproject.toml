[project]
name = "chatgpt-orchestrator"
version = "0.1.0"
description = "Claude-orchestrated pool of browser-driven free ChatGPT workers, exposed over MCP / Skill / ACP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kyle" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "psutil>=5.9",
    "typer>=0.12",
    "httpx>=0.27",
    "anyio>=4.4",
    "mcp>=1.2",
    # Browser automation. playwright is the fallback driver (browser.driver="playwright");
    # patchright is a drop-in, stealth-patched playwright and the *default* driver
    # (config.browser.driver == "patchright") -- required, not optional, so a bare
    # `uv sync` works out of the box instead of failing at first browser launch.
    "playwright>=1.45",
    "patchright>=1.45",
]

[project.optional-dependencies]
stealth = ["playwright-stealth>=1.0.6"]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
all = ["playwright-stealth>=1.0.6", "fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
orchestrator = "orchestrator.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits real chatgpt.com; opt-in only, skipped unless ORCH_LIVE=1 is set",
]

[tool.ruff]
line-length = 100
target-version = "py312"
