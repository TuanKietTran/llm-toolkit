[project]
name = "jcf-intel"
version = "0.1.0"
description = "Job CV Finder intelligence worker: candidate facts, matching, CV selection and evidence-checked document generation."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[project.scripts]
jcf-intel = "jcf_intel.worker:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jcf_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
